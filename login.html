<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopSphere | Login</title>

  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-container">
    <h2>Welcome Back to ShopSphere</h2>
    <form action="#" method="post">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>
      <p id="warn" style="color:red; font-size:14px; display:none;"> Email must contain '@'</p>
  

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" required>
      <p id="strength" style="font-size:14px; display:none;"></p>
      <button type="submit" onclick="popup()">Log In</button>

    </form>

    <p class="footer-text">New to ShopSphere?<a href="#">Create an account</a></p>
  </div>
  <script src="login.js"></script>
</body>
</html>
